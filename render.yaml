services:
  - type: web
    name: pulsehook-webhook-dispatcher
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: PORT
        value: "3000"
      - key: SQLITE_PATH
        value: /app/data/webhooks.db
      - key: ALLOW_PRIVATE_URLS
        value: "true"
      - key: SIGNING_SECRET
        generateValue: true
