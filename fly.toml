app = "pulsehook-webhook-dispatcher"
primary_region = "sin"

[build]

[env]
  ENV = "production"
  PORT = "3000"
  SQLITE_PATH = "/app/data/webhooks.db"
  ALLOW_PRIVATE_URLS = "true"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"
